name: Signal Stream
on:
  workflow_dispatch:
    inputs:
      loop: {default: "3300"}
      name: {default: "signals.json"}
# 唔設 concurrency：接力時新舊 job 重疊約 20 分鐘（新 job 熱身要 ~5 分鐘），兩邊都寫同一個 signals.json，冇空窗
jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy yfinance longbridge
      - name: Stream signals
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_ENABLE_OVERNIGHT: "true"
          SB_LOOP_SECS: ${{ inputs.loop || '3300' }}
          SB_INGEST_NAME: ${{ inputs.name || 'signals.json' }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python scanner/signal_stream.py
