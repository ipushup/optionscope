name: Daily Table
on:
  workflow_dispatch:
    inputs:
      loop: {default: "3300"}
# 唔設 concurrency：接力時新舊重疊，兩邊都寫 daily.json
jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy yfinance longbridge
      - name: Daily table
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_ENABLE_OVERNIGHT: "true"
          SB_LOOP_SECS: ${{ inputs.loop || '3300' }}
          SB_INGEST_NAME: daily.json
          SB_OUT: ${{ github.workspace }}/frontend/public/daily.json
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: python scanner/daily_table.py
