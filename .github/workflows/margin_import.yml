name: Margin Import

# 改 scanner/margin.txt 後自動轉成 margin_cache.json（= 手動跑 margin_import.py），
# commit 返 main，並即刻上傳 margin.json 去私人 gateway，主頁 superscript 即時更新。
# 只監聽 margin.txt；bot 只 commit margin_cache.json，唔會自己觸發自己。

on:
  push:
    branches: [main]
    paths: ['scanner/margin.txt']
  workflow_dispatch:

concurrency:
  group: margin-import
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Convert margin.txt -> margin_cache.json
        working-directory: scanner
        run: python margin_import.py
      - name: Commit margin_cache.json
        run: |
          if git diff --quiet -- scanner/margin_cache.json; then
            echo "margin_cache.json 冇變，跳過 commit"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scanner/margin_cache.json
          git commit -m "chore: regenerate margin_cache.json from margin.txt [skip ci]"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && break
            sleep 5
          done
      - name: Publish margin.json to private gateway
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          mkdir -p frontend/public
          cp scanner/margin_cache.json frontend/public/margin.json
          bash scanner/push_private.sh frontend/public/margin.json
