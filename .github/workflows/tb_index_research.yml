name: TB vs index research (one-off)
on:
  workflow_dispatch:
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy
      - run: python scanner/tb_index_research.py scanner/Watchlists.txt | tee research.md
      - uses: actions/upload-artifact@v4
        with:
          name: tb-index
          path: |
            research.md
            tb_index_research.json
            tb_index_*.csv
