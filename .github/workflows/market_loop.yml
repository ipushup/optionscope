name: Market Loop
# Home「Market Snapshot」每分鐘更新。由 Cloudflare Worker 排程叫醒（GitHub cron 唔準時）。
on:
  workflow_dispatch:
concurrency:
  group: market-loop
  cancel-in-progress: false
jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install yfinance pandas longbridge
      - name: Loop (every 60s for ~55 min)
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: |
          end=$(( $(date +%s) + 3300 ))
          fast=0; n=0
          while [ $(date +%s) -lt $end ]; do
            t0=$(date +%s); n=$((n+1))
            python scanner/market_snapshot.py || echo "::warning::snapshot failed"
            # Worker 回 store:"do" 先每分鐘推；仲係 KV（免費版每日 1,000 寫）就每 5 分鐘推一次
            if [ "$fast" = "1" ] || [ $((n % 5)) -eq 1 ]; then
              bash scanner/push_private.sh frontend/public/market.json || true
              if grep -q '"store":"do"' /tmp/ingest_out 2>/dev/null; then fast=1; else fast=0; fi
            fi
            sleep $(( 60 - ($(date +%s) - t0) > 5 ? 60 - ($(date +%s) - t0) : 5 ))
          done
