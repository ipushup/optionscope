name: Deploy Private Gateway

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - 'worker/**'
      - '.github/workflows/deploy_gateway.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build React app
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Deploy Worker (app + gateway)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "ℹ CLOUDFLARE_API_TOKEN 未設，跳過"; exit 0; fi
          npm install
          npx wrangler deploy
