name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build React app
        working-directory: frontend
        env:
          # Watchlist.jsx嘅highlight跨裝置sync用 -- fine-grained PAT，
          # scope鎖死淨係 ipushup/optionscope 呢個repo嘅 Issues: read/write。
          # CRA會喺build嗰陣將REACT_APP_*環境變數inline入最終JS bundle，
          # 所以token本身仍然會喺瀏覽器devtools見到(呢個係已知、接受咗嘅
          # trade-off)，呢度做嘅淨係避免token出現喺repo嘅git history度。
          REACT_APP_GH_TOKEN: ${{ secrets.WATCHLIST_GH_TOKEN }}
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          keep_files: true
