name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build React app
        working-directory: frontend
        # Watchlist.jsx嘅highlight跨裝置sync而家經Cloudflare Worker代理，
        # 真token存喺Worker嘅secret度，唔再需要呢度注入REACT_APP_GH_TOKEN
        # (之前個做法令token跌落build出嚟嗰份public JS bundle，俾GitHub
        # push protection擋咗push，所以改做而家呢個中間人架構)。
        run: |
          npm install
          npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend/build
          keep_files: true
