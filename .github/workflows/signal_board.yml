name: Signal Board
on:
  schedule:
    - cron: '*/30 * * * 1-5'    # GitHub cron 唔準時，所以每次開 55 分鐘循環、互相重疊；新一輪會取代舊一輪
  workflow_dispatch:
    inputs:
      limit: {default: "0"}
      loop: {default: "3300"}
      syms: {default: "INTC,BABA,FUTU,SKHY,NVDA,AMD,MRNA,SPCX,CRWV,NOK"}
concurrency:
  group: signal-board
  cancel-in-progress: true
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy yfinance longbridge
      - name: Build signals.json
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_ENABLE_OVERNIGHT: "true"
          SB_LIMIT: ${{ inputs.limit }}
          SB_LOOP_SECS: ${{ inputs.loop || '3300' }}
          SB_INTERVAL: "30"
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
          # 測試階段：排程預設只跑呢 10 隻；清空（改成 ""）就跑成個 watchlist
          SB_SYMS: ${{ github.event_name == 'workflow_dispatch' && inputs.syms || 'INTC,BABA,FUTU,SKHY,NVDA,AMD,MRNA,SPCX,CRWV,NOK' }}
        run: python scanner/signal_board.py
