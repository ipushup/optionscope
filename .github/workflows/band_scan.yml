name: Triple Band Radar

on:
  schedule:
    # heavy scan: after US close (20:00 UTC). Radar 用 20:15，band 排 20:40 —
    # 錯開嚟避免兩個 workflow 同時打 Yahoo。
    - cron: '40 20 * * 1-5'
    # heavy scan: after HK close (08:00 UTC)
    - cron: '40 8 * * 1-5'
    # US quotes — pre+regular+post. 分鐘位 5/20/35/50，同 radar 嘅 */15 錯開。
    - cron: '5,20,35,50 8-23 * * 1-5'
    # HK quotes — 01:00-08:00 UTC
    - cron: '5,20,35,50 1-7 * * 1-5'
  workflow_dispatch:
    inputs:
      quotes_only:
        description: 'Quotes only (skip the heavy scan)'
        type: boolean
        default: false

jobs:
  band:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install yfinance pandas numpy

      # FULL SCAN unless: (a) 係報價 cron，或 (b) 手動剔咗 quotes_only。
      # 手動 run 預設就係 full scan。
      - name: Determine mode
        id: mode
        run: |
          FULL=true
          SCHED="${{ github.event.schedule }}"
          if [ "${{ github.event_name }}" = "schedule" ] && \
             [ "${SCHED:0:2}" != "40" ]; then
            FULL=false
          fi
          if [ "${{ github.event.inputs.quotes_only }}" = "true" ]; then
            FULL=false
          fi
          echo "full=$FULL" >> $GITHUB_OUTPUT
          echo "════════════════════════════════"
          echo "  event    : ${{ github.event_name }}"
          echo "  schedule : $SCHED"
          echo "  FULL SCAN: $FULL"
          echo "════════════════════════════════"

      - name: Pull existing band.json from gh-pages (quote-only runs)
        if: steps.mode.outputs.full == 'false'
        run: |
          mkdir -p frontend/public
          git fetch origin gh-pages --depth=1
          if ! git show origin/gh-pages:band.json > frontend/public/band.json 2>/dev/null; then
            echo "::error::Could not read band.json from gh-pages."
            echo "報價 run 需要一份現成 band.json。手動行一次 workflow"
            echo "（quotes_only 唔好剔）先產生佢。"
            exit 1
          fi
          if ! python -c "import json,sys; d=json.load(open('frontend/public/band.json')); sys.exit(0 if d.get('tickers') else 1)"; then
            echo "::error::gh-pages 嗰份 band.json 冇 tickers（空嘅）。"
            echo "手動行一次 full scan 重建佢。"
            exit 1
          fi
          echo "Pulled band.json from gh-pages OK"

      # 業績 veto 來源（daily_brief 出）。冇就跳過，唔會 fail。
      - name: Pull earnings.json from gh-pages
        run: |
          mkdir -p frontend/public
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git show origin/gh-pages:earnings.json > frontend/public/earnings.json 2>/dev/null \
            || echo '{}' > frontend/public/earnings.json

      # 形成中→確認 轉化率嘅滾動紀錄。冇就當空，唔會 fail。
      - name: Pull forming log from gh-pages
        run: |
          mkdir -p frontend/public
          git fetch origin gh-pages --depth=1 2>/dev/null || true
          git show origin/gh-pages:band_forming_log.json > frontend/public/band_forming_log.json 2>/dev/null \
            || echo '{"days":{}}' > frontend/public/band_forming_log.json

      - name: Full band scan
        if: steps.mode.outputs.full == 'true'
        run: python scanner/band_scan.py

      - name: Verify band.json
        run: |
          python - <<'PY'
          import json, sys
          try:
              d = json.load(open('frontend/public/band.json'))
          except Exception as e:
              print(f"::error::band.json unreadable: {e}"); sys.exit(1)
          if d.get('tickers') is None:
              print("::error::band.json 冇 'tickers' key — full scan 未跑過。")
              print("手動重跑一次（quotes_only 唔好剔）。")
              sys.exit(1)
          c = d.get('counts', {})
          print(f"confirmed={c.get('confirmed')} forming={c.get('forming')} "
                f"candidates={c.get('candidates')} errors={c.get('errors')} "
                f"scanned_at={d.get('scanned_at')}")
          PY

      - name: Refresh quotes
        env:
          # 只抽開緊市嗰邊嘅報價，唔好收市時段照掃 170 隻。
          #   HK cron (01-07 UTC) → HK ; US cron (08-23) → US ;
          #   full scan 同手動 run → 兩邊都要。
          QUOTE_MARKETS: >-
            ${{ (github.event_name == 'schedule' && startsWith(github.event.schedule, '5,20,35,50 1-7')) && 'HK'
             || (github.event_name == 'schedule' && startsWith(github.event.schedule, '5,20,35,50 8-23')) && 'US'
             || 'US,HK' }}
        run: python scanner/band_quotes.py

      # ── WATCHLIST（Symbol/TBand/UT/ST/Last/%Chg/E%Chg 嗰個新tab）─────────
      # watchlist_quotes.py 用返同一個 QUOTE_MARKETS，同 band_quotes.py 一齊
      # 喺*每次* run 都刷（quotes-only 同 full scan 都要），先至可以跟得住
      # 開緊市嗰邊嘅價。indicator_scan.py（UT Bot/SuperTrend 要重新計）同
      # merge_watchlist.py 就淨係 full scan 至用得著跑 —— 呢兩樣同 band.json
      # 自己個 confirmed/forming/candidates 一樣，全部 closed-candle based，
      # 15分鐘報價cron跑多次都係嘥Yahoo額度冇著數。
      - name: Refresh watchlist quotes
        env:
          QUOTE_MARKETS: >-
            ${{ (github.event_name == 'schedule' && startsWith(github.event.schedule, '5,20,35,50 1-7')) && 'HK'
             || (github.event_name == 'schedule' && startsWith(github.event.schedule, '5,20,35,50 8-23')) && 'US'
             || 'US,HK' }}
        run: |
          python scanner/watchlist_quotes.py \
            --watchlist scanner/Watchlists.txt \
            --out frontend/public/watchlist_quotes.json

      - name: Watchlist indicators + merge (full scan only)
        if: steps.mode.outputs.full == 'true'
        run: |
          python scanner/indicator_scan.py \
            --watchlist scanner/Watchlists.txt \
            --out frontend/public/indicator_signals.json
          python scanner/merge_watchlist.py \
            --watchlist scanner/Watchlists.txt \
            --band frontend/public/band.json \
            --band-scan scanner/band_scan.py \
            --indicators frontend/public/indicator_signals.json \
            --quotes frontend/public/watchlist_quotes.json \
            --out frontend/public/watchlist_merged.json

      - name: Pull existing watchlist_merged.json from gh-pages (quote-only runs)
        # quotes-only run 冇重新跑 merge，watchlist_merged.json 淨係喺呢個
        # checkout 度唔存在 —— 要攞返 gh-pages 現存嗰份，等下面 push 步驟唔會
        # 用返「未跑過」嗰份空白版本覆蓋走真係有嘅資料。
        if: steps.mode.outputs.full == 'false'
        run: |
          git fetch origin gh-pages --depth=1
          git show origin/gh-pages:watchlist_merged.json > frontend/public/watchlist_merged.json 2>/dev/null \
            || echo "⚠ gh-pages 都未有 watchlist_merged.json（未跑過 full scan），跳過"

      - name: Push to gh-pages
        run: |
          ls -la frontend/public/band.json frontend/public/band_quotes.json \
            frontend/public/watchlist_quotes.json
          cp frontend/public/band.json             /tmp/band_out.json
          cp frontend/public/band_quotes.json      /tmp/band_quotes_out.json
          cp frontend/public/watchlist_quotes.json /tmp/watchlist_quotes_out.json
          [ -f frontend/public/band_forming_log.json ] && \
            cp frontend/public/band_forming_log.json /tmp/band_log_out.json || true
          [ -f frontend/public/watchlist_merged.json ] && \
            cp frontend/public/watchlist_merged.json /tmp/watchlist_merged_out.json || true

          git fetch origin gh-pages
          git checkout gh-pages
          cp /tmp/band_out.json             ./band.json
          cp /tmp/band_quotes_out.json      ./band_quotes.json
          cp /tmp/watchlist_quotes_out.json ./watchlist_quotes.json
          [ -f /tmp/band_log_out.json ] && cp /tmp/band_log_out.json ./band_forming_log.json || true
          [ -f /tmp/watchlist_merged_out.json ] && \
            cp /tmp/watchlist_merged_out.json ./watchlist_merged.json || true

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add band.json band_quotes.json band_forming_log.json \
                  watchlist_quotes.json watchlist_merged.json 2>/dev/null \
            || git add band.json band_quotes.json watchlist_quotes.json
          git diff --staged --quiet && echo "No changes" || \
            git commit -m "band: $(date -u '+%Y-%m-%d %H:%M UTC') full=${{ steps.mode.outputs.full }}"
          git push origin gh-pages
