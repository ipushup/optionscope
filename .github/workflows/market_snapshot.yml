name: Market Snapshot

on:
  schedule:
    # 每 5 分鐘（GitHub 排程最密），平日；覆蓋 HK 開市到 US 收市後（UTC 01:00–21:59）
    - cron: '*/5 1-21 * * 1-5'
  workflow_dispatch:

concurrency:
  group: market-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas longbridge
      - name: Build market.json
        env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
        run: python scanner/market_snapshot.py
      - name: Publish to private gateway
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          INGEST_TOKEN: ${{ secrets.INGEST_TOKEN }}
        run: bash scanner/push_private.sh frontend/public/market.json
