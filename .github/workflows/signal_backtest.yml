name: Signal Backtest
on:
  workflow_dispatch:
    inputs:
      days: {default: "120"}
      extra: {default: "30"}
jobs:
  bt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install pandas numpy yfinance longbridge
      - env:
          LONGBRIDGE_APP_KEY: ${{ secrets.LONGBRIDGE_APP_KEY }}
          LONGBRIDGE_APP_SECRET: ${{ secrets.LONGBRIDGE_APP_SECRET }}
          LONGBRIDGE_ACCESS_TOKEN: ${{ secrets.LONGBRIDGE_ACCESS_TOKEN }}
          LONGBRIDGE_ENABLE_OVERNIGHT: "true"
          BT_DAYS: ${{ inputs.days }}
          BT_EXTRA: ${{ inputs.extra }}
        run: python scanner/signal_backtest.py | tee bt.txt
